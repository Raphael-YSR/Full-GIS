<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>News &amp; Events — Tana Water Works Development Agency</title>
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --green: #5a8a32;
                --green-dark: #3d6122;
                --green-light: #eef4e8;
                --ink: #1a1c1a;
                --ink-mid: #4a4d49;
                --ink-light: #8a8e89;
                --rule: #d0d4cc;
                --bg: #f5f5f2;
                --white: #ffffff;
            }
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "IBM Plex Sans", sans-serif;
                background: var(--bg);
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
            }

            /* Page header */
            .page-header {
                background: var(--ink);
                padding: 52px 0 40px;
                border-bottom: 4px solid var(--green);
            }
            .page-header-inner {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 24px;
            }
            .page-header-label {
                display: block;
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--green);
                margin-bottom: 10px;
            }
            .page-header h1 {
                font-family: "IBM Plex Serif", serif;
                font-size: clamp(1.8rem, 4vw, 2.6rem);
                font-weight: 600;
                color: var(--white);
                line-height: 1.2;
            }
            .page-header-sub {
                margin-top: 8px;
                font-size: 0.88rem;
                color: var(--ink-light);
                font-weight: 300;
            }

            /* Main */
            .news-page {
                max-width: 1200px;
                margin: 0 auto;
                padding: 48px 24px 80px;
            }

            /* Breadcrumb */
            .breadcrumb {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 32px;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--ink-light);
            }
            .breadcrumb a {
                color: var(--green);
                text-decoration: none;
            }
            .breadcrumb a:hover {
                text-decoration: underline;
            }

            /* Grid */
            .cards-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                border: 2px solid var(--ink);
            }

            .news-card {
                position: relative;
                display: flex;
                flex-direction: column;
                text-decoration: none;
                color: inherit;
                background: var(--white);
                border-right: 2px solid var(--ink);
                border-bottom: 2px solid var(--ink);
                transition: background 0.15s;
            }
            .news-card:nth-child(3n) {
                border-right: none;
            }
            /* Remove bottom border from last row */
            .news-card:nth-last-child(-n + 3):nth-child(3n + 1),
            .news-card:nth-last-child(-n + 3):nth-child(3n + 1) ~ .news-card {
                border-bottom: none;
            }
            .news-card:hover {
                background: var(--green-light);
            }

            .card-img-wrap {
                aspect-ratio: 16/10;
                overflow: hidden;
                border-bottom: 2px solid var(--ink);
                flex-shrink: 0;
                position: relative;
            }
            .card-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.5s ease;
            }
            .news-card:hover .card-img {
                transform: scale(1.04);
            }

            .card-badge {
                position: absolute;
                top: 0;
                left: 0;
                background: var(--ink);
                color: var(--white);
                font-size: 0.6rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                padding: 5px 12px;
            }

            .card-body {
                padding: 20px 22px 26px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;
            }
            .card-date {
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-light);
            }
            .card-title {
                font-family: "IBM Plex Serif", serif;
                font-size: 0.98rem;
                font-weight: 600;
                line-height: 1.45;
                color: var(--ink);
            }
            .card-excerpt {
                font-size: 0.8rem;
                color: var(--ink-mid);
                line-height: 1.65;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .card-cta {
                margin-top: auto;
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--green);
            }

            @media (max-width: 900px) {
                .cards-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
                .news-card:nth-child(3n) {
                    border-right: 2px solid var(--ink);
                }
                .news-card:nth-child(2n) {
                    border-right: none;
                }
            }
            @media (max-width: 540px) {
                .cards-grid {
                    grid-template-columns: 1fr;
                }
                .news-card {
                    border-right: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="page-header">
            <div class="page-header-inner">
                <span class="page-header-label">Media Centre</span>
                <h1>News &amp; Events</h1>
                <p class="page-header-sub">
                    Updates, announcements and highlights from TWWDA.
                </p>
            </div>
        </div>

        <main class="news-page">
            <nav class="breadcrumb">
                <a href="/">Home</a>
                <span>/</span>
                <span>News &amp; Events</span>
            </nav>

            <div class="cards-grid" id="cards-grid"></div>
        </main>

        <script src="../assets/news/newsData.js"></script>
        <script>
            (function () {
                var grid = document.getElementById("cards-grid");
                if (
                    !grid ||
                    typeof newsArticles === "undefined" ||
                    !newsArticles.length
                )
                    return;

                newsArticles.forEach(function (article, index) {
                    var card = document.createElement("a");
                    card.href = "/news/" + article.id;
                    card.className = "news-card";
                    card.innerHTML =
                        '<div class="card-img-wrap">' +
                        (index === 0
                            ? '<span class="card-badge">Latest</span>'
                            : "") +
                        '<img src="' +
                        article.images[0] +
                        '" alt="' +
                        article.title +
                        '" class="card-img" />' +
                        "</div>" +
                        '<div class="card-body">' +
                        '<span class="card-date">' +
                        article.date +
                        "</span>" +
                        '<p class="card-title">' +
                        article.title +
                        "</p>" +
                        '<p class="card-excerpt">' +
                        article.paragraphs[0] +
                        "</p>" +
                        '<span class="card-cta">Read article ' +
                        '<svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>' +
                        "</span>" +
                        "</div>";
                    grid.appendChild(card);
                });
            })();
        </script>
    </body>
</html>
