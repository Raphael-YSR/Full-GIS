<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Project | GIS Admin Dashboard</title>
        <link rel="icon" type="image/png" href="../docs/images/logo.png" />
        <link
            rel="shortcut icon"
            type="image/png"
            href="../docs/images/logo.png"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="/admin/styles.css" />
        <style>
            /* Custom styles for form elements */
            input,
            select,
            textarea {
                background-color: #1e293b;
                border: 1px solid #3f4c63;
                color: white;
                padding: 0.75rem;
                border-radius: 0.375rem;
                width: 100%;
                margin-top: 0.25rem;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #60a5fa;
            }

            textarea {
                min-height: 120px;
            }

            .coordinates {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            button {
                transition: all 0.2s ease;
            }

            button:hover {
                transform: translateY(-2px);
            }

            /* Website Content divider */
            .website-content-divider {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 8px 0 4px;
            }
            .website-content-divider::before,
            .website-content-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #3f4c63;
            }
            .website-content-divider span {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: #60a5fa;
                white-space: nowrap;
            }

            .block-remove-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                background: #374151;
                border: none;
                color: #9ca3af;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .block-remove-btn:hover {
                background: #ef4444;
                color: white;
                transform: none;
            }

            .image-block-preview {
                display: none;
                margin-top: 6px;
                width: 100%;
                max-height: 140px;
                object-fit: cover;
                border-radius: 4px;
                border: 1px solid #3f4c63;
            }

            .article-status-badge {
                display: inline-block;
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                padding: 2px 10px;
                border-radius: 999px;
                margin-left: 8px;
            }
            .badge-exists {
                background: #14532d;
                color: #86efac;
            }
            .badge-new {
                background: #1e3a5f;
                color: #93c5fd;
            }
        </style>
    </head>
    <body class="bg-gray-900 text-white min-h-screen">
        <div class="container mx-auto px-4 py-8 max-w-3xl">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold font-marlin">EDIT PROJECT</h1>
                <p class="text-gray-400 font-marlinsoftmedium">
                    UPDATE EXISTING PROJECT INFORMATION
                </p>
            </header>

            <div
                id="projectDetails"
                class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6"
            >
                <!-- Project details are populated via JavaScript -->
                <div class="animate-pulse">
                    <div class="h-4 bg-gray-700 rounded w-3/4 mb-2"></div>
                    <div class="h-3 bg-gray-700 rounded w-1/2"></div>
                </div>
            </div>

            <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                <form id="editProjectForm" class="space-y-6">
                    <div>
                        <label
                            for="project_status"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT STATUS</label
                        >
                        <select
                            name="project_status"
                            id="project_status"
                            class="w-full text-base h-9 p-2 font-inter"
                        ></select>
                    </div>

                    <div>
                        <label
                            for="progress"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT PROGRESS (%)</label
                        >
                        <input
                            type="number"
                            name="progress"
                            id="progress"
                            class="w-full text-base h-9 p-2 font-inter"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >COORDINATES</label
                        >
                        <div class="coordinates">
                            <div>
                                <label
                                    for="latitude"
                                    class="block text-xs text-gray-400 mb-1 font-marlinsoftmedium"
                                    >LATITUDE</label
                                >
                                <input
                                    type="number"
                                    name="latitude"
                                    id="latitude"
                                    step="0.000001"
                                    class="w-full text-base h-9 p-2 font-inter"
                                />
                            </div>
                            <div>
                                <label
                                    for="longitude"
                                    class="block text-xs text-gray-400 mb-1 font-marlinsoftmedium"
                                    >LONGITUDE</label
                                >
                                <input
                                    type="number"
                                    name="longitude"
                                    id="longitude"
                                    step="0.000001"
                                    class="w-full text-base h-9 p-2 font-inter"
                                />
                            </div>
                        </div>
                    </div>

                    <div>
                        <label
                            for="description"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT DESCRIPTION</label
                        >
                        <textarea
                            name="description"
                            id="description"
                            class="w-full text-base h-9 p-2 font-inter"
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-white text-black py-3 px-4 rounded font-medium font-marlin hover:bg-gray-200"
                    >
                        UPDATE PROJECT
                    </button>
                </form>
            </div>

            <!-- ── Website Content ── -->
            <div class="bg-gray-800 p-8 rounded-lg shadow-lg mt-6">
                <form id="articleForm" class="space-y-6">
                    <div class="website-content-divider">
                        <span class="font-marlin">
                            WEBSITE CONTENT
                            <span
                                id="article-badge"
                                class="article-status-badge"
                            ></span>
                        </span>
                    </div>
                    <p
                        class="text-gray-400 text-xs font-marlinsoftmedium -mt-2"
                    >
                        This content appears on the public project article page.
                    </p>

                    <!-- Hero Image -->
                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >PRIMARY IMAGE URL</label
                        >
                        <input
                            type="url"
                            id="hero_image_url"
                            placeholder="https://..."
                            class="w-full text-base h-9 p-2 font-inter"
                        />
                        <div id="hero-preview-wrap" class="hidden mt-2">
                            <img
                                id="hero-preview"
                                src=""
                                alt="Hero preview"
                                class="w-full rounded border border-gray-600 object-cover"
                                style="max-height: 180px"
                            />
                        </div>
                    </div>

                    <!-- Paragraphs -->
                    <div>
                        <div class="mb-2">
                            <label class="block text-sm font-bold font-marlin"
                                >PARAGRAPHS</label
                            >
                        </div>
                        <div id="paragraphs-container" class="space-y-3"></div>
                    </div>

                    <!-- Gallery Images -->
                    <div>
                        <div class="mb-2">
                            <label class="block text-sm font-bold font-marlin"
                                >OTHER IMAGES</label
                            >
                        </div>
                        <div id="images-container" class="space-y-3"></div>
                    </div>

                    <button
                        type="submit"
                        id="articleSubmitBtn"
                        class="w-full bg-blue-600 text-white py-3 px-4 rounded font-medium font-marlin hover:bg-blue-700"
                    >
                        SAVE WEBSITE CONTENT
                    </button>
                </form>
            </div>

            <div class="mt-8 text-center">
                <a
                    href="/gis/search"
                    class="text-gray-400 hover:text-white font-marlin"
                    >BACK TO SEARCH</a
                >
                <span class="mx-2 text-gray-600">|</span>
                <a
                    href="/gis/admin"
                    class="text-gray-400 hover:text-white font-marlin"
                    >BACK TO DASHBOARD</a
                >
            </div>
        </div>

        <script src="/admin/edit-data.js"></script>
    </body>
</html>
