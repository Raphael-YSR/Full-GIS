<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add Project | GIS Admin Dashboard</title>
        <link rel="icon" type="image/png" href="../docs/images/logo.png" />
        <link
            rel="shortcut icon"
            type="image/png"
            href="../docs/images/logo.png"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="/admin/styles.css" />

        <style>
            input,
            select,
            textarea {
                background-color: #1e293b;
                border: 1px solid #3f4c63;
                color: white;
                padding: 0.75rem;
                border-radius: 0.375rem;
                width: 100%;
                margin-top: 0.25rem;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #60a5fa;
            }

            textarea {
                min-height: 120px;
            }

            .coordinates,
            .side-by-side-inputs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            button {
                transition: all 0.2s ease;
            }

            button:hover {
                transform: translateY(-2px);
            }

            /* Added style for the button next to coordinates */
            .coordinates-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .coordinates-button {
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                position: relative;
            }

            .coordinates-button img {
                width: 20px;
                height: 20px;
                filter: brightness(1000%) invert(1);
                transition: transform 0.2s ease;
            }

            .coordinates-button:hover img {
                transform: scale(1.1);
            }

            /* Website Content divider */
            .website-content-divider {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 8px 0 4px;
            }
            .website-content-divider::before,
            .website-content-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #3f4c63;
            }
            .website-content-divider span {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: #60a5fa;
                white-space: nowrap;
            }

            /* Paragraph / image block remove button */
            .block-remove-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                background: #374151;
                border: none;
                color: #9ca3af;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .block-remove-btn:hover {
                background: #ef4444;
                color: white;
                transform: none;
            }

            .image-block {
                position: relative;
            }
            .image-block-preview {
                display: none;
                margin-top: 6px;
                width: 100%;
                max-height: 140px;
                object-fit: cover;
                border-radius: 4px;
                border: 1px solid #3f4c63;
            }

            /* Tooltip styles */
            .tooltip-container {
                position: relative;
            }

            .tooltip {
                visibility: hidden;
                opacity: 0;
                position: absolute;
                bottom: 100%;
                right: 0;
                margin-bottom: 8px;
                background-color: #1e293b;
                color: white;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 12px;
                white-space: nowrap;
                z-index: 1000;
                border: 1px solid #3f4c63;
                transition:
                    opacity 0.3s ease,
                    visibility 0.3s ease;
                pointer-events: none;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }

            .tooltip::after {
                content: "";
                position: absolute;
                top: 100%;
                right: 10px;
                border-width: 6px;
                border-style: solid;
                border-color: #1e293b transparent transparent transparent;
            }

            .tooltip-container:hover .tooltip {
                visibility: visible;
                opacity: 1;
                transition-delay: 0.5s;
            }
        </style>
    </head>
    <body class="bg-gray-900 text-white min-h-screen">
        <div class="container mx-auto px-4 py-8 max-w-3xl">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold font-marlin">ADD PROJECT</h1>
                <p class="text-gray-400 font-marlinsoftmedium">
                    CREATE NEW PROJECT AND ADD TO DATABASE
                </p>
            </header>

            <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                <form id="addProjectForm" class="space-y-6">
                    <div>
                        <label
                            for="project_name"
                            class="block text-sm font-bold mb-1 mt-1 font-marlin"
                            >PROJECT NAME</label
                        >
                        <input
                            type="text"
                            name="project_name"
                            id="project_name"
                            class="w-full text-base h-9 p-2 font-inter"
                            placeholder="Enter project name..."
                            required
                        />
                    </div>

                    <div>
                        <label
                            for="county_id"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >COUNTY</label
                        >
                        <select
                            name="county_id"
                            id="county_id"
                            class="w-full text-base h-9 p-2 font-inter"
                        ></select>
                    </div>

                    <div>
                        <label
                            for="project_status"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT STATUS</label
                        >
                        <select
                            name="project_status"
                            id="project_status"
                            class="w-full text-base h-9 p-2 font-inter"
                        ></select>
                    </div>

                    <div>
                        <label
                            for="project_type"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT TYPE</label
                        >
                        <select
                            name="project_type"
                            id="project_type"
                            class="w-full text-base h-9 p-2 font-inter"
                        ></select>
                    </div>

                    <div class="side-by-side-inputs">
                        <div>
                            <label
                                for="people_served"
                                class="block text-sm font-bold mb-1 font-marlin"
                                >PEOPLE SERVED</label
                            >
                            <input
                                type="number"
                                name="people_served"
                                id="people_served"
                                class="w-full text-base h-9 p-2 font-inter"
                                placeholder="5000..."
                            />
                        </div>
                        <div>
                            <label
                                for="progress"
                                class="block text-sm font-bold mb-1 font-marlin"
                                >PROJECT PROGRESS (%)</label
                            >
                            <input
                                type="number"
                                name="progress"
                                id="progress"
                                placeholder="33..."
                                class="w-full text-base h-9 p-2 font-inter"
                            />
                        </div>
                    </div>

                    <div>
                        <label
                            for="description"
                            class="block text-sm font-bold mb-1 font-marlin"
                            >PROJECT DESCRIPTION</label
                        >
                        <textarea
                            name="description"
                            id="description"
                            placeholder="Describe the project..."
                            class="w-full text-base h-9 p-2 font-inter"
                        ></textarea>
                    </div>

                    <div>
                        <div class="coordinates-header">
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >COORDINATES</label
                            >
                            <div class="flex gap-2">
                                <button
                                    type="button"
                                    id="pasteCoordinates"
                                    class="coordinates-button tooltip-container"
                                >
                                    <img
                                        src="/admin/images/copy.png"
                                        alt="Paste Coordinates"
                                    />
                                    <span class="tooltip"
                                        >Paste coordinates from clipboard
                                        (Format: lat, lng)</span
                                    >
                                </button>
                                <button
                                    type="button"
                                    id="useGeolocation"
                                    class="coordinates-button tooltip-container"
                                >
                                    <svg
                                        width="20"
                                        height="20"
                                        viewBox="0 0 24 24"
                                        fill="white"
                                        xmlns="http://www.w3.org/2000/svg"
                                    >
                                        <path
                                            d="M12 2C12.5523 2 13 2.44772 13 3V4.06189C16.0532 4.51314 18.4869 6.94687 18.9381 10H20C20.5523 10 21 10.4477 21 11C21 11.5523 20.5523 12 20 12H18.9381C18.4869 15.0531 16.0532 17.4869 13 17.9381V19C13 19.5523 12.5523 20 12 20C11.4477 20 11 19.5523 11 19V17.9381C7.94687 17.4869 5.51314 15.0531 5.06189 12H4C3.44772 12 3 11.5523 3 11C3 10.4477 3.44772 10 4 10H5.06189C5.51314 6.94687 7.94687 4.51314 11 4.06189V3C11 2.44772 11.4477 2 12 2ZM12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6ZM12 9C13.6569 9 15 10.3431 15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9Z"
                                            fill="white"
                                        />
                                    </svg>
                                    <span class="tooltip"
                                        >Use your current GPS location</span
                                    >
                                </button>
                            </div>
                        </div>
                        <div class="coordinates">
                            <div>
                                <label
                                    for="latitude"
                                    class="block text-xs text-gray-400 mb-1 font-marlinsoftmedium"
                                    >LATITUDE</label
                                >
                                <input
                                    type="number"
                                    name="latitude"
                                    id="latitude"
                                    step="0.000001"
                                    placeholder="-0.0400..."
                                    class="w-full text-base h-9 p-2 font-inter"
                                />
                            </div>
                            <div>
                                <label
                                    for="longitude"
                                    class="block text-xs text-gray-400 mb-1 font-marlinsoftmedium"
                                    >LONGITUDE</label
                                >
                                <input
                                    type="number"
                                    name="longitude"
                                    id="longitude"
                                    step="0.000001"
                                    placeholder="36.677..."
                                    class="w-full text-base h-9 p-2 font-inter"
                                />
                            </div>
                        </div>
                    </div>

                    <!-- ─────────────────────────────────────────── -->
                    <!-- WEBSITE CONTENT SECTION                      -->
                    <!-- ─────────────────────────────────────────── -->
                    <div class="website-content-divider">
                        <span class="font-marlin">WEBSITE CONTENT</span>
                    </div>

                    <p
                        class="text-gray-400 text-xs font-marlinsoftmedium -mt-2"
                    >
                        Optional — fill this in to publish an article on the
                        public projects page.
                    </p>

                    <!-- Hero Image -->
                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >PRIMARY IMAGE URL</label
                        >
                        <input
                            type="url"
                            id="hero_image_url"
                            placeholder="https://..."
                            class="w-full text-base h-9 p-2 font-inter"
                        />
                        <div id="hero-preview-wrap" class="hidden mt-2">
                            <img
                                id="hero-preview"
                                src=""
                                alt="Hero preview"
                                class="w-full rounded border border-gray-600 object-cover"
                                style="max-height: 180px"
                            />
                        </div>
                    </div>

                    <!-- Paragraphs -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-bold font-marlin"
                                >PARAGRAPHS</label
                            >
                            <button
                                type="button"
                                id="addParagraphBtn"
                                class="text-xs font-marlin text-blue-400 hover:text-blue-300 border border-blue-400 hover:border-blue-300 px-3 py-1 rounded"
                            >
                                + ADD PARAGRAPH
                            </button>
                        </div>
                        <div id="paragraphs-container" class="space-y-3">
                            <!-- First paragraph always present -->
                            <div class="paragraph-block relative">
                                <textarea
                                    class="w-full text-base p-2 font-inter paragraph-input"
                                    placeholder="Write a paragraph about this project..."
                                    rows="4"
                                ></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Gallery Images -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-bold font-marlin"
                                >OTHER IMAGES</label
                            >
                            <button
                                type="button"
                                id="addImageBtn"
                                class="text-xs font-marlin text-blue-400 hover:text-blue-300 border border-blue-400 hover:border-blue-300 px-3 py-1 rounded"
                            >
                                + ADD IMAGE
                            </button>
                        </div>
                        <div id="images-container" class="space-y-3">
                            <!-- dynamically added -->
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-white text-black py-3 px-4 rounded font-medium font-marlin hover:bg-gray-200"
                    >
                        ADD PROJECT
                    </button>
                </form>
            </div>

            <div class="mt-8 text-center text-base">
                <a
                    href="/gis/admin"
                    class="text-gray-400 hover:text-white font-marlin"
                    >BACK TO DASHBOARD</a
                >
                <span class="mx-2 text-gray-600">|</span>
                <a
                    href="/gis"
                    class="text-gray-400 hover:text-white font-marlin"
                    >RETURN TO MAIN MAP</a
                >
            </div>
        </div>

        <script src="/admin/add-data.js"></script>
    </body>
</html>
