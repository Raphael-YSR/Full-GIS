<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add Tender | GIS Admin Dashboard</title>
        <link rel="icon" type="image/png" href="../../docs/images/logo.png" />
        <link
            rel="shortcut icon"
            type="image/png"
            href="../../docs/images/logo.png"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="/admin/styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <style>
            input,
            select,
            textarea {
                background-color: #1e293b;
                border: 1px solid #3f4c63;
                color: white;
                padding: 0.75rem;
                border-radius: 0.375rem;
                width: 100%;
                margin-top: 0.25rem;
            }
            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #60a5fa;
            }
            textarea {
                min-height: 100px;
            }
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .section-divider {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 24px 0 16px;
            }
            .section-divider::before,
            .section-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: #3f4c63;
            }
            .section-divider span {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: #60a5fa;
                white-space: nowrap;
            }
            .block-remove-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                background: #374151;
                border: none;
                color: #9ca3af;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .block-remove-btn:hover {
                background: #ef4444;
                color: white;
                transform: none;
            }
            .paragraph-block,
            .document-block {
                position: relative;
                margin-bottom: 0.5rem;
            }
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }
            .modal-content {
                background-color: #1f2937;
                border-radius: 0.5rem;
                padding: 2rem;
                width: 90%;
                max-width: 400px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
            .hidden {
                display: none;
            }
        </style>
    </head>
    <body class="bg-gray-900 text-white min-h-screen">
        <a
            href="/admin/tenders/manage-tenders.html"
            class="fixed top-4 left-4 z-50 bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-md shadow-md font-marlin text-sm transition"
        >
            ← Back to Tenders
        </a>

        <div class="container mx-auto px-4 py-8 max-w-4xl">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold font-marlin">ADD NEW TENDER</h1>
                <p class="text-gray-400 font-marlinsoftmedium">
                    Create a new procurement notice
                </p>
            </header>

            <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                <form id="addTenderForm" class="space-y-6">
                    <!-- Basic Information -->
                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >TENDER TITLE *</label
                        >
                        <input
                            type="text"
                            id="title"
                            name="title"
                            required
                            placeholder="Enter tender title..."
                        />
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >SLUG *</label
                            >
                            <input
                                type="text"
                                id="slug"
                                name="slug"
                                required
                                placeholder="url-friendly-name"
                            />
                            <p class="text-xs text-gray-400 mt-1">
                                URL-friendly identifier (auto-generated from
                                title)
                            </p>
                        </div>
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >REFERENCE NUMBER</label
                            >
                            <input
                                type="text"
                                id="reference_number"
                                placeholder="TWWDA/T/XXX/2025"
                            />
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >CATEGORY</label
                            >
                            <select id="category">
                                <option value="">Select category...</option>
                                <option value="works">Works</option>
                                <option value="services">Services</option>
                                <option value="goods">Goods</option>
                                <option value="consultancy">Consultancy</option>
                            </select>
                        </div>
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >PROCUREMENT METHOD</label
                            >
                            <input
                                type="text"
                                id="procurement_method"
                                placeholder="Open Tender, RFP, etc."
                            />
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >PUBLISHED DATE</label
                            >
                            <input type="date" id="published_date" />
                        </div>
                        <div>
                            <label
                                class="block text-sm font-bold mb-1 font-marlin"
                                >CLOSING DATE</label
                            >
                            <input type="date" id="closing_date" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >STATUS</label
                        >
                        <select id="status">
                            <option value="open">Open</option>
                            <option value="closed">Closed</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="awarded">Awarded</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-1 font-marlin"
                            >DESCRIPTION</label
                        >
                        <textarea
                            id="description"
                            placeholder="Brief description of the tender..."
                        ></textarea>
                    </div>

                    <!-- Documents Section -->
                    <div class="section-divider">
                        <span>TENDER DOCUMENTS</span>
                    </div>
                    <div id="documents-container"></div>

                    <!-- Paragraphs Section (Rich Content) -->
                    <div class="section-divider">
                        <span>ADDITIONAL CONTENT (OPTIONAL)</span>
                    </div>
                    <p class="text-gray-400 text-xs -mt-2 mb-2">
                        This content will appear on the public tender page.
                    </p>
                    <div id="paragraphs-container"></div>

                    <button
                        type="submit"
                        class="w-full bg-white text-black py-3 px-4 rounded font-medium font-marlin hover:bg-gray-200 transition"
                    >
                        ADD TENDER
                    </button>
                </form>
            </div>
        </div>

        <!-- Success/Error Popup -->
        <div id="popup" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="text-center">
                    <i
                        id="popupIcon"
                        class="fas fa-check-circle text-green-500 text-5xl mb-4"
                    ></i>
                    <h2
                        id="popupTitle"
                        class="text-xl font-bold font-marlin mb-2"
                    >
                        Success
                    </h2>
                    <p id="popupMessage" class="text-gray-300"></p>
                    <button
                        id="closePopup"
                        class="mt-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-marlin"
                    >
                        OK
                    </button>
                </div>
            </div>
        </div>

        <script src="/admin/tenders/add-tender.js"></script>
    </body>
</html>
